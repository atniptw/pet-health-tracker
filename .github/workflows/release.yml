name: Test and release

on:
  push:
    branches: [main]

# Never run two releases at once, and never cancel one mid-upload.
concurrency:
  group: release
  cancel-in-progress: false

env:
  FLUTTER_VERSION: "3.47.5"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # tests-changed.sh compares the pushed commits with the ones before.
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # Java and Node run the Firestore emulator for the rules tests.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: firestore-tests/package-lock.json
      - run: flutter pub get --enforce-lockfile
      - run: npm --prefix firestore-tests ci
      - run: ./scripts/check.sh
      # check.sh compares with origin/main, which is this push in CI, so the
      # pushed commits are checked here. After a force-push the old tip isn't
      # in the clone, so it is fetched by id; if that fails the run fails
      # rather than skip commits.
      - run: |
          before="${{ github.event.before }}"
          if ! git cat-file -e "$before^{commit}" 2>/dev/null; then
            git fetch --no-tags -q origin "$before" || {
              echo "The old tip $before can't be fetched, so the pushed commits are unknown." >&2
              exit 1
            }
          fi
          ./scripts/tests-changed.sh "$before" "${{ github.sha }}"

  smoke-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: firestore-tests/package-lock.json
      - run: npm --prefix firestore-tests ci
      - run: flutter pub get --enforce-lockfile
      - name: Enable KVM for the Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # The system image and a booted snapshot of the emulator are cached: the
      # image download has failed a run, and booting from a snapshot is faster.
      # sdkmanager skips an image that is already installed.
      - name: Cache the Android emulator
        uses: actions/cache@v6
        id: emulator-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
            /usr/local/lib/android/sdk/system-images/android-35/google_apis/x86_64
          key: emulator-35-google_apis-x86_64
      - name: Create the emulator snapshot to cache
        if: steps.emulator-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Created the emulator snapshot."
      # Debug builds talk to the Firebase emulators (lib/main.dart), so the app
      # boots without touching production.
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: firestore-tests/node_modules/.bin/firebase emulators:exec --only auth,firestore --project pet-health-tracker-2eed5 ./scripts/smoke-android.sh

  deploy-firestore-rules:
    needs: [test, smoke-android]
    runs-on: ubuntu-latest
    # Off until the rules-deploy service account and its key secret exist.
    if: vars.FIRESTORE_RULES_DEPLOY_ENABLED == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_RULES_SERVICE_ACCOUNT_JSON }}
      - uses: google-github-actions/setup-gcloud@v3
      - run: ./scripts/deploy-firestore-rules.sh

  deploy-android:
    needs: [test, smoke-android]
    runs-on: ubuntu-latest
    # Off until the Play Console app exists and the first AAB was uploaded by hand.
    if: vars.ANDROID_DEPLOY_ENABLED == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Write signing config
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload-keystore.jks"
          cat > android/key.properties <<PROPS
          storeFile=$RUNNER_TEMP/upload-keystore.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          PROPS
      - run: flutter pub get --enforce-lockfile
      - run: flutter build appbundle --release --build-number=${{ github.run_number }}
      - name: Upload to Play internal testing
        working-directory: android
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          PLAY_RELEASE_STATUS: ${{ vars.PLAY_RELEASE_STATUS }}
        run: bundle exec fastlane internal

  deploy-ios:
    needs: [test, smoke-android]
    runs-on: macos-latest
    # Off until the App Store Connect app and API key secrets exist (on since 2026-10-11).
    if: vars.IOS_DEPLOY_ENABLED == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Write signing files
        env:
          IOS_DIST_P12_BASE64: ${{ secrets.IOS_DIST_P12_BASE64 }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          echo "$IOS_DIST_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/distribution.p12"
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/app-store.mobileprovision"
      - run: flutter pub get --enforce-lockfile
      - run: flutter build ios --release --no-codesign --build-number=${{ github.run_number }}
      - name: Sign and upload to TestFlight
        working-directory: ios
        env:
          IOS_DIST_P12_PATH: ${{ runner.temp }}/distribution.p12
          IOS_DIST_P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
          IOS_PROVISIONING_PROFILE_PATH: ${{ runner.temp }}/app-store.mobileprovision
          # Not named APP_STORE_CONNECT_API_KEY*: fastlane reads those names itself.
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: bundle exec fastlane testflight
