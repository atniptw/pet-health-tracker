name: Test and release

on:
  push:
    branches: [main]

# Never run two releases at once, and never cancel one mid-upload.
concurrency:
  group: release
  cancel-in-progress: false

env:
  FLUTTER_VERSION: "3.47.5"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: ./scripts/check.sh

  deploy-android:
    needs: test
    runs-on: ubuntu-latest
    # Off until the Play Console app exists and the first AAB was uploaded by hand.
    if: vars.ANDROID_DEPLOY_ENABLED == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Write signing config
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload-keystore.jks"
          cat > android/key.properties <<PROPS
          storeFile=$RUNNER_TEMP/upload-keystore.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          PROPS
      - run: flutter pub get --enforce-lockfile
      - run: flutter build appbundle --release --build-number=${{ github.run_number }}
      - name: Upload to Play internal testing
        working-directory: android
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          PLAY_RELEASE_STATUS: ${{ vars.PLAY_RELEASE_STATUS }}
        run: bundle exec fastlane internal

  deploy-ios:
    needs: test
    runs-on: macos-latest
    # Off until the Apple Developer account and App Store Connect app exist.
    if: vars.IOS_DEPLOY_ENABLED == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter build ios --release --no-codesign --build-number=${{ github.run_number }}
      # Signing and TestFlight upload go here once the Apple account is set up.
